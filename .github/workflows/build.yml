name: Build and test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtconnectivity'
          cache: true
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --target codapkmeter protocol_tests backend_tests --parallel 4
      - name: Test decoder and persistence
        run: ctest --test-dir build --output-on-failure
      - name: Exercise desktop and phone layouts
        env:
          QT_QPA_PLATFORM: offscreen
          QT_QUICK_BACKEND: software
        run: |
          ./build/codapkmeter --demo --smoke-test
          ./build/codapkmeter --demo --mobile --smoke-test
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android toolchain
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'ndk;27.2.12479018'
      - uses: jurplel/install-qt-action@v4
        id: qt
        with:
          version: '6.8.3'
          target: android
          arch: android_arm64_v8a
          modules: 'qtconnectivity'
          cache: true
      - name: Configure arm64
        env:
          QT_ROOT_DIR: ${{ steps.qt.outputs.qt-root-dir }}
          QT_HOST_PATH: ${{ steps.qt.outputs.qt-host-path }}
        run: |
          "$QT_ROOT_DIR/bin/qt-cmake" -S . -B build-android -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=OFF \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 \
            -DANDROID_SDK_ROOT="$ANDROID_HOME" \
            -DANDROID_NDK_ROOT="$ANDROID_HOME/ndk/27.2.12479018" \
            -DQT_HOST_PATH="$QT_HOST_PATH" \
            -DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON
      - name: Build installable debug APK
        run: cmake --build build-android --target apk --parallel 4
      - uses: actions/upload-artifact@v4
        with:
          name: CodApkMeter-android-arm64-debug
          path: build-android/android-build/build/outputs/apk/debug/*.apk
          if-no-files-found: error
